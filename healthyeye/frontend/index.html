<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthyEye</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f7f6f0; color: #1a202c; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: #1b4332; margin-bottom: 4px; font-size: 2rem; }
        p.subtitle { color: #52796f; margin: 0; font-size: 0.95rem; max-width: 420px; }
        .card { background: #ffffff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); width: 100%; max-width: 500px; text-align: center; }
        .upload-zone { border: 2px dashed #b7e4c7; border-radius: 8px; padding: 24px 15px; cursor: pointer; transition: background 0.2s ease; }
        .upload-zone:hover { background-color: #f0fdf4; }
        input[type="file"] { display: none; }
        .preview-img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 12px; display: none; margin-left: auto; margin-right: auto; }
        .status { margin-top: 15px; font-weight: 600; font-size: 0.95rem; }
        
        /* Structured Output Formatting */
        .result { text-align: left; background: #f8fafc; border-left: 4px solid #2d6a4f; padding: 16px 20px; border-radius: 4px; margin-top: 18px; font-size: 0.9rem; line-height: 1.5; display: none; }
        .result h3 { color: #1b4332; margin-top: 14px; margin-bottom: 6px; font-size: 1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 3px; }
        .result h3:first-child { margin-top: 0; }
        .result ul { padding-left: 18px; margin: 4px 0; }
        .result li { margin-bottom: 4px; }
        .result p { margin: 4px 0; }
        .result strong { color: #0f5132; font-weight: 600; }
        
        p.disclaimer { font-size: 0.75rem; color: #718096; max-width: 440px; text-align: center; margin-top: 20px; }
        a.reset { display: inline-block; margin-top: 14px; color: #2d6a4f; text-decoration: underline; cursor: pointer; font-size: 0.85rem; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>HealthyEye</h1>
        <p class="subtitle">Quick medicine overview, simple purpose, side effects, and global safety rating.</p>
    </header>

    <div class="card">
        <div class="upload-zone" id="uploadZone">
            <p id="uploadPrompt">Tap to upload a photo<br><small style="color: #718096;">Upload back of strip or box label</small></p>
            <input type="file" id="fileInput" accept="image/*">
            <img id="previewImg" class="preview-img" alt="Uploaded Medicine Preview">
        </div>

        <div id="statusBox" class="status"></div>
        <div id="resultCard" class="result"></div>
        <a id="resetLink" class="reset" onclick="resetUI()">Upload another photo</a>
    </div>

    <p class="disclaimer">HealthyEye gives general informational guidance only — it is not a medical diagnosis or prescription.</p>

    <script>
        const API_BASE = "https://healthyeye-1.onrender.com";

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const previewImg = document.getElementById('previewImg');
        const statusBox = document.getElementById('statusBox');
        const resultCard = document.getElementById('resultCard');
        const resetLink = document.getElementById('resetLink');

        uploadZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            previewImg.src = URL.createObjectURL(file);
            previewImg.style.display = 'block';
            uploadPrompt.style.display = 'none';

            statusBox.style.color = '#2d6a4f';
            statusBox.textContent = 'Analyzing image...';
            resultCard.style.display = 'none';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_BASE}/analyze-medicine`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusBox.textContent = '';
                    resultCard.innerHTML = marked.parse(data.analysis);
                    resultCard.style.display = 'block';
                } else {
                    statusBox.style.color = '#e63946';
                    statusBox.textContent = data.detail || 'Backend processing error occurred.';
                }
            } catch (err) {
                statusBox.style.color = '#e63946';
                statusBox.textContent = 'Network error: Failed to reach server.';
                console.error(err);
            } finally {
                resetLink.style.display = 'inline-block';
            }
        });

        function resetUI() {
            fileInput.value = '';
            previewImg.style.display = 'none';
            uploadPrompt.style.display = 'block';
            statusBox.textContent = '';
            resultCard.innerHTML = '';
            resultCard.style.display = 'none';
            resetLink.style.display = 'none';
        }
    </script>
</body>
</html>
