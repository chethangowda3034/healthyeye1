<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthyEye</title>
    <!-- Three.js for 3D Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Marked for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Cropper.js Stylesheet & Script -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: #0b1d19; 
            color: #1a202c; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            overflow-x: hidden;
            position: relative;
        }

        /* 3D Canvas Background */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        header { 
            text-align: center; 
            margin-bottom: 20px; 
            z-index: 1; 
        }

        h1 { 
            color: #d8f3dc; 
            margin-bottom: 4px; 
            font-size: 2.2rem; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        p.subtitle { 
            color: #b7e4c7; 
            margin: 0; 
            font-size: 0.95rem; 
            max-width: 420px; 
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }

        .card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            border-radius: 16px; 
            padding: 24px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            z-index: 1;
        }
        
        .btn-group { display: flex; gap: 12px; margin-bottom: 16px; justify-content: center; }
        .btn { flex: 1; padding: 12px 16px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: background 0.2s ease, transform 0.1s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: #2d6a4f; color: #ffffff; }
        .btn-primary:hover { background-color: #1b4332; }
        .btn-secondary { background-color: #e2e8f0; color: #2d3748; }
        .btn-secondary:hover { background-color: #cbd5e0; }

        input[type="file"] { display: none; }
        
        /* Cropper Container Overlay */
        .crop-container { display: none; margin-top: 15px; text-align: center; }
        .img-container { max-height: 280px; width: 100%; margin-bottom: 12px; background: #000; border-radius: 8px; overflow: hidden; }
        #imageToCrop { max-width: 100%; display: block; }

        .preview-box { border: 2px dashed #b7e4c7; border-radius: 8px; padding: 12px; background-color: #f0fdf4; display: none; margin-top: 10px; }
        .preview-img { max-width: 100%; max-height: 180px; border-radius: 6px; display: block; margin: 0 auto; }
        
        .status { margin-top: 15px; font-weight: 600; font-size: 0.95rem; }
        
        /* Structured Output Formatting */
        .result { text-align: left; background: #f8fafc; border-left: 4px solid #2d6a4f; padding: 16px 20px; border-radius: 6px; margin-top: 18px; font-size: 0.9rem; line-height: 1.5; display: none; }
        .result h3 { color: #1b4332; margin-top: 14px; margin-bottom: 6px; font-size: 1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 3px; }
        .result h3:first-child { margin-top: 0; }
        .result ul { padding-left: 18px; margin: 4px 0; }
        .result li { margin-bottom: 4px; }
        .result p { margin: 4px 0; }
        .result strong { color: #0f5132; font-weight: 600; }
        
        p.disclaimer { font-size: 0.75rem; color: #95d5b2; max-width: 440px; text-align: center; margin-top: 20px; z-index: 1; }
        a.reset { display: inline-block; margin-top: 14px; color: #2d6a4f; text-decoration: underline; cursor: pointer; font-size: 0.85rem; display: none; }
    </style>
</head>
<body>

    <!-- 3D Canvas Background -->
    <canvas id="bgCanvas"></canvas>

    <header>
        <h1>HealthyEye</h1>
        <p class="subtitle"><bold>analyze medicine labels instantly.</bold></p>
    </header>

    <div class="card">
        <!-- Action Options -->
        <div class="btn-group" id="actionButtons">
            <button class="btn btn-primary" onclick="triggerCamera()">Take Photo</button>
            <button class="btn btn-secondary" onclick="triggerFilePicker()">Upload File</button>
        </div>

        <input type="file" id="cameraInput" accept="image/*" capture="environment">
        <input type="file" id="fileInput" accept="image/*">

        <!-- Cropping Interface -->
        <div class="crop-container" id="cropContainer">
            <div class="img-container">
                <img id="imageToCrop" alt="To Crop">
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="confirmCrop()">Crop & Analyze</button>
        </div>

        <!-- Image Preview Area -->
        <div class="preview-box" id="previewBox">
            <img id="previewImg" class="preview-img" alt="Final Cropped Medicine">
        </div>

        <div id="statusBox" class="status"></div>
        <div id="resultCard" class="result"></div>
        <a id="resetLink" class="reset" onclick="resetUI()">Scan another medicine</a>
    </div>

    <p class="disclaimer">HealthyEye gives general informational guidance only — it is not a medical diagnosis or prescription.</p>

    <script>
        // --- 3D THREE.JS BACKGROUND ANIMATION ---
        const canvas = document.getElementById('bgCanvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Create floating geometric molecular nodes
        const geometry = new THREE.IcosahedronGeometry(0.7, 0);
        const material = new THREE.MeshNormalMaterial({ wireframe: true });
        const nodes = [];

        for (let i = 0; i < 25; i++) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.x = (Math.random() - 0.5) * 15;
            mesh.position.y = (Math.random() - 0.5) * 15;
            mesh.position.z = (Math.random() - 0.5) * 15;
            mesh.rotation.x = Math.random() * Math.PI;
            mesh.rotation.y = Math.random() * Math.PI;
            const scale = Math.random() * 0.6 + 0.3;
            mesh.scale.set(scale, scale, scale);
            scene.add(mesh);
            nodes.push(mesh);
        }

        camera.position.z = 8;

        // Smooth Mouse Parallax
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 0.5;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 0.5;
        });

        function animate() {
            requestAnimationFrame(animate);
            nodes.forEach((node, idx) => {
                node.rotation.x += 0.003 + idx * 0.0001;
                node.rotation.y += 0.005 + idx * 0.0001;
            });

            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- APPLICATION LOGIC ---
        const API_BASE = "https://healthyeye-1.onrender.com";

        const cameraInput = document.getElementById('cameraInput');
        const fileInput = document.getElementById('fileInput');
        const cropContainer = document.getElementById('cropContainer');
        const imageToCrop = document.getElementById('imageToCrop');
        const previewBox = document.getElementById('previewBox');
        const previewImg = document.getElementById('previewImg');
        const statusBox = document.getElementById('statusBox');
        const resultCard = document.getElementById('resultCard');
        const resetLink = document.getElementById('resetLink');
        const actionButtons = document.getElementById('actionButtons');

        let cropper = null;

        function triggerCamera() { cameraInput.click(); }
        function triggerFilePicker() { fileInput.click(); }

        cameraInput.addEventListener('change', (e) => loadFileForCropping(e.target.files[0]));
        fileInput.addEventListener('change', (e) => loadFileForCropping(e.target.files[0]));

        function loadFileForCropping(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                imageToCrop.src = event.target.result;
                actionButtons.style.display = 'none';
                cropContainer.style.display = 'block';

                if (cropper) {
                    cropper.destroy();
                }
                
                cropper = new Cropper(imageToCrop, {
                    aspectRatio: NaN,
                    viewMode: 1,
                    autoCropArea: 0.8,
                });
            };
            reader.readAsDataURL(file);
        }

        function confirmCrop() {
            if (!cropper) return;

            cropper.getCroppedCanvas({ maxWidth: 1200, maxHeight: 1200 }).toBlob((blob) => {
                cropContainer.style.display = 'none';
                cropper.destroy();
                cropper = null;

                previewImg.src = URL.createObjectURL(blob);
                previewBox.style.display = 'block';

                analyzeCroppedImage(blob);
            }, 'image/jpeg', 0.85);
        }

        async function analyzeCroppedImage(blob) {
            statusBox.style.color = '#1b4332';
            statusBox.textContent = 'Analyzing cropped image...';
            resultCard.style.display = 'none';

            const formData = new FormData();
            formData.append('file', blob, 'medicine_crop.jpg');

            try {
                const response = await fetch(`${API_BASE}/analyze-medicine`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusBox.textContent = '';
                    resultCard.innerHTML = marked.parse(data.analysis);
                    resultCard.style.display = 'block';
                } else {
                    statusBox.style.color = '#e63946';
                    statusBox.textContent = data.detail || 'Backend processing error occurred.';
                }
            } catch (err) {
                statusBox.style.color = '#e63946';
                statusBox.textContent = 'Network error: Failed to reach server.';
                console.error(err);
            } finally {
                resetLink.style.display = 'inline-block';
            }
        }

        function resetUI() {
            cameraInput.value = '';
            fileInput.value = '';
            cropContainer.style.display = 'none';
            previewBox.style.display = 'none';
            actionButtons.style.display = 'flex';
            statusBox.textContent = '';
            resultCard.innerHTML = '';
            resultCard.style.display = 'none';
            resetLink.style.display = 'none';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }
    </script>
</body>
</html>
