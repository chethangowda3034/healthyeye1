<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthyEye</title>
    <!-- Marked for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Cropper.js Stylesheet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <!-- Cropper.js Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f7f6f0; color: #1a202c; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: #1b4332; margin-bottom: 4px; font-size: 2rem; }
        p.subtitle { color: #52796f; margin: 0; font-size: 0.95rem; max-width: 420px; }
        .card { background: #ffffff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); width: 100%; max-width: 500px; text-align: center; }
        
        .btn-group { display: flex; gap: 12px; margin-bottom: 16px; justify-content: center; }
        .btn { flex: 1; padding: 12px 16px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: background 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background-color: #2d6a4f; color: #ffffff; }
        .btn-primary:hover { background-color: #1b4332; }
        .btn-secondary { background-color: #e2e8f0; color: #2d3748; }
        .btn-secondary:hover { background-color: #cbd5e0; }

        input[type="file"] { display: none; }
        
        /* Cropper Container Overlay */
        .crop-container { display: none; margin-top: 15px; text-align: center; }
        .img-container { max-height: 300px; width: 100%; margin-bottom: 12px; background: #000; border-radius: 8px; overflow: hidden; }
        #imageToCrop { max-width: 100%; display: block; }

        .preview-box { border: 2px dashed #b7e4c7; border-radius: 8px; padding: 12px; background-color: #f0fdf4; display: none; margin-top: 10px; }
        .preview-img { max-width: 100%; max-height: 180px; border-radius: 6px; display: block; margin: 0 auto; }
        
        .status { margin-top: 15px; font-weight: 600; font-size: 0.95rem; }
        
        /* Structured Output Formatting */
        .result { text-align: left; background: #f8fafc; border-left: 4px solid #2d6a4f; padding: 16px 20px; border-radius: 4px; margin-top: 18px; font-size: 0.9rem; line-height: 1.5; display: none; }
        .result h3 { color: #1b4332; margin-top: 14px; margin-bottom: 6px; font-size: 1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 3px; }
        .result h3:first-child { margin-top: 0; }
        .result ul { padding-left: 18px; margin: 4px 0; }
        .result li { margin-bottom: 4px; }
        .result p { margin: 4px 0; }
        .result strong { color: #0f5132; font-weight: 600; }
        
        p.disclaimer { font-size: 0.75rem; color: #718096; max-width: 440px; text-align: center; margin-top: 20px; }
        a.reset { display: inline-block; margin-top: 14px; color: #2d6a4f; text-decoration: underline; cursor: pointer; font-size: 0.85rem; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>HealthyEye</h1>
        <p class="subtitle">Scan, crop, and analyze medicine labels instantly.</p>
    </header>

    <div class="card">
        <!-- Action Options -->
        <div class="btn-group" id="actionButtons">
            <button class="btn btn-primary" onclick="triggerCamera()">Take Photo</button>
            <button class="btn btn-secondary" onclick="triggerFilePicker()">Upload File</button>
        </div>

        <input type="file" id="cameraInput" accept="image/*" capture="environment">
        <input type="file" id="fileInput" accept="image/*">

        <!-- Cropping Interface -->
        <div class="crop-container" id="cropContainer">
            <div class="img-container">
                <img id="imageToCrop" alt="To Crop">
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="confirmCrop()">Crop & Analyze</button>
        </div>

        <!-- Image Preview Area -->
        <div class="preview-box" id="previewBox">
            <img id="previewImg" class="preview-img" alt="Final Cropped Medicine">
        </div>

        <div id="statusBox" class="status"></div>
        <div id="resultCard" class="result"></div>
        <a id="resetLink" class="reset" onclick="resetUI()">Scan another medicine</a>
    </div>

    <p class="disclaimer">HealthyEye gives general informational guidance only — it is not a medical diagnosis or prescription.</p>

    <script>
        const API_BASE = "https://healthyeye-1.onrender.com";

        const cameraInput = document.getElementById('cameraInput');
        const fileInput = document.getElementById('fileInput');
        const cropContainer = document.getElementById('cropContainer');
        const imageToCrop = document.getElementById('imageToCrop');
        const previewBox = document.getElementById('previewBox');
        const previewImg = document.getElementById('previewImg');
        const statusBox = document.getElementById('statusBox');
        const resultCard = document.getElementById('resultCard');
        const resetLink = document.getElementById('resetLink');
        const actionButtons = document.getElementById('actionButtons');

        let cropper = null;

        function triggerCamera() { cameraInput.click(); }
        function triggerFilePicker() { fileInput.click(); }

        cameraInput.addEventListener('change', (e) => loadFileForCropping(e.target.files[0]));
        fileInput.addEventListener('change', (e) => loadFileForCropping(e.target.files[0]));

        function loadFileForCropping(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                imageToCrop.src = event.target.result;
                actionButtons.style.display = 'none';
                cropContainer.style.display = 'block';

                if (cropper) {
                    cropper.destroy();
                }
                
                cropper = new Cropper(imageToCrop, {
                    aspectRatio: NaN,
                    viewMode: 1,
                    autoCropArea: 0.8,
                });
            };
            reader.readAsDataURL(file);
        }

        function confirmCrop() {
            if (!cropper) return;

            // Get cropped image as a canvas blob
            cropper.getCroppedCanvas({ maxWidth: 1200, maxHeight: 1200 }).toBlob((blob) => {
                // Hide cropper container
                cropContainer.style.display = 'none';
                cropper.destroy();
                cropper = null;

                // Show preview of cropped image
                previewImg.src = URL.createObjectURL(blob);
                previewBox.style.display = 'block';

                // Send to backend API
                analyzeCroppedImage(blob);
            }, 'image/jpeg', 0.85);
        }

        async function analyzeCroppedImage(blob) {
            statusBox.style.color = '#2d6a4f';
            statusBox.textContent = 'Analyzing cropped image...';
            resultCard.style.display = 'none';

            const formData = new FormData();
            formData.append('file', blob, 'medicine_crop.jpg');

            try {
                const response = await fetch(`${API_BASE}/analyze-medicine`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusBox.textContent = '';
                    resultCard.innerHTML = marked.parse(data.analysis);
                    resultCard.style.display = 'block';
                } else {
                    statusBox.style.color = '#e63946';
                    statusBox.textContent = data.detail || 'Backend processing error occurred.';
                }
            } catch (err) {
                statusBox.style.color = '#e63946';
                statusBox.textContent = 'Network error: Failed to reach server.';
                console.error(err);
            } finally {
                resetLink.style.display = 'inline-block';
            }
        }

        function resetUI() {
            cameraInput.value = '';
            fileInput.value = '';
            cropContainer.style.display = 'none';
            previewBox.style.display = 'none';
            actionButtons.style.display = 'flex';
            statusBox.textContent = '';
            resultCard.innerHTML = '';
            resultCard.style.display = 'none';
            resetLink.style.display = 'none';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }
    </script>
</body>
</html>
